name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The commit counts are refreshed on the owner's PC (tools/publish-daily.ps1) and pushed as
# public/data/contributions.json, so this workflow needs no tokens or secrets at all.

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Tests include the privacy check on public/data/contributions.json.
      - run: npm test
      - run: npm run build
      - name: Reject private files in the published site
        run: |
          if find dist \( -iname '*.md' -o -iname '*.markdown' -o -name '.env*' -o -name '*.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '.npmrc' -o -name 'config.local.json' -o -type l \) -print -quit | grep -q .; then
            echo "::error::Private file or symbolic link in dist"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
